[model]
backbone = gru
width = 256
layers = 4

[env]
time_limit = 50
time_step = 0.25
val_size = 100
test_size = 500
randomize_attributes = false

[reward]
success_reward = 1.0
collision_penalty = -0.5
timeout_penalty = -0.5
progress_reward = 0.0
time_penalty = 0.0
stand_penalty = 0.0
discomfort_dist = 0.2
discomfort_penalty_factor = 0.5

[sim]
train_val_sim = circle_crossing
test_sim = circle_crossing
square_width = 10
circle_radius = 4
human_num = 5

[humans]
visible = true
policy = orca
radius = 0.3
v_pref = 1.0
sensor = coordinates

[robot]
visible = false
policy = none
radius = 0.3
v_pref = 1.0
sensor = coordinates
success_radius = 0.25

[orca]
neighbor_dist = 10
max_neighbors = 10
time_horizon = 5
time_horizon_obst = 5
safety_space = 0.10

[action_space]
kinematics = holonomic

[policy]
n_speeds = 5
n_headings = 16
v_min = 0.05
v_max = 1.0
sampling = exponential
include_stop = false

[eval_protocol]
safety_margin = 0.2
risk_lambda = 0.8
action_smoothing = 0.3

[train]
gamma = 0.99
batch_size = 256
learning_rate = 1e-5
updates_per_ep = 4
il_epochs = 50
il_batch_size = 256
il_learning_rate = 1e-4

[buffer]
capacity = 200000
seq_len = 24

[imitation_learning]
max_il_prefill = 50000
teacher_safety_space = 0.25
teacher_neighbor_dist = 6
teacher_max_neighbors = 15
teacher_time_horizon = 5
teacher_time_horizon_obst = 5

[sarl]
epsilon_start = 0.3
epsilon_end = 0.05
epsilon_decay_episodes = 1500
